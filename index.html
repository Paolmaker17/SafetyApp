<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/png" href="../SafetyApp.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">

  <title>Safety App</title>
</head>
<body class="flex flex-wrap justify-center color-body">

  <div id="main-container" class="relative top-10 flex flex-col w-[80%] pt-[10px] pb-[10px] pr-[12px] pl-[12px]">
    <div id="tabs-container" class="h-10 w-full flex flex-wrap">
      <button class="h-10 rounded-t-md color-main p-2 shadow-xl">Send Allarm</button>
      <button class="h-10 rounded-t-md color-main p-2 shadow-xl">Allarms</button>
      <button class="h-10 rounded-t-md color-main p-2 shadow-xl">Users</button>
    </div>

    
    
    <div id="page" class="w-full rounded-t-md rounded-b-md shadow-xl color-main pr-5 pl-5 pt-5 pb-5 flex flex-wrap justify-center">
      <div class="w-[30%]">
        <div class="w-full h-25 color-islands rounded-t-md rounded-b-md border border-[#FFD9C8] p-5 flex flex-col mb-5">
          <select name="" id="" class="w-full h-[100%] mb-5 border border-[#FFD9C8] rounded-t-md rounded-b-md" required>
            <option value="1">Allarme Terremoto</option>
            <option value="2">Allarme Incedio</option>
            <option value="3">Allarme Alluvione</option>
            <option value="4" selected>Allarme Generico</option>
          </select>
        </div>
        
        <div class="w-full h-30 color-islands rounded-t-md rounded-b-md border border-[#FFD9C8] p-5">
          <button class="w-full h-[100%] mb-5 border border-[#FFD9C8] rounded-t-md rounded-b-md"></button>
        </div>
      </div>

      <div class="w-[65%] h-60 color-islands rounded-t-md rounded-b-md border border-[#FFD9C8] p-5 ml-5">
        <textarea name="descAllarm" class="resize-none w-full h-[100%] border border-[#FFD9C8] rounded-t-md rounded-b-md"></textarea>
      </div>

    </div>
  </div>

</body>
</html>
