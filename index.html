<!DOCTYPE html>
<html>

<head>
  <link rel="icon" type="image/png" href="">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Safety App</title>
</head>

<body class="flex justify-center bg-[var(--bg)] text-[var(--text)] nunito">

  <div class="relative top-16 w-[85%] max-w-5xl">

    <!-- Tabs -->
    <div class="flex border-b border-[var(--border)]">
      <button disabled data-name="invioAllarme"
        class="disabled:translate-y-px px-6 py-2 bg-[var(--soft)] border border-[var(--border)] border-b-0 rounded-t-xl font-medium hover:bg-[#FFE4D9] disabled:bg-[var(--card)] transition">
        Invio Allarme
      </button>

      <button data-name="allarmi"
        class="disabled:translate-y-px px-6 py-2 bg-[var(--soft)] border border-[var(--border)] border-b-0 rounded-t-xl font-medium hover:bg-[#FFE4D9] disabled:bg-[var(--card)] transition">
        Allarmi
      </button>

      <button data-name="utenti"
        class="disabled:translate-y-px px-6 py-2 bg-[var(--soft)] border border-[var(--border)] border-b-0 rounded-t-xl font-medium hover:bg-[#FFE4D9] disabled:bg-[var(--card)] transition">
        Utenti
      </button>
    </div>

    <div class="bg-[var(--card)] shadow-xl rounded-b-xl p-6 border border-t-0 border-[var(--border)]">

      <!-- Content Invio Allarme -->
      <div class="flex gap-6" id="invioAllarme">

        <div class="w-1/3 space-y-4">
          <div class="bg-[var(--soft)] border border-[var(--border)] rounded-xl p-3">
            <select
              class="w-full p-3 rounded-xl border border-[var(--border)] focus:border-[var(--allarm)] focus:ring-4 focus:ring-[var(--allarm)]/20 outline-none transition bg-[var(--card)]">
              <option value="1">Allarme Terremoto</option>
              <option value="2">Allarme Incendio</option>
              <option value="3">Allarme Alluvione</option>
              <option value="4" selected>Allarme Generico</option>
            </select>
          </div>

          <div class="bg-[var(--soft)] border border-[var(--border)] rounded-xl p-3 h-24 flex items-center">
            <button
              class="w-full font-extrabold h-full bg-[var(--allarm)] hover:bg-[var(--allarm-hover)] text-white rounded-xl transition transform hover:-translate-y-1 hover:shadow-lg">Invia
              Allarme</button>
          </div>
        </div>

        <div class="w-2/3 bg-[var(--soft)] border border-[var(--border)] rounded-xl p-4 h-64 flex flex-col">
          <label class="mb-2 font-semibold text-[var(--text-light)]">Descrizione</label>
          <textarea class="w-full 
                          h-full 
                          p-3 
                          resize-none 
                          rounded-xl 
                          border 
                          border-[var(--border)] 
                          focus:border-[var(--allarm)] 
                          focus:ring-4 
                          focus:ring-[var(--allarm)]/20 
                          outline-none transition 
                          bg-[var(--card)]"></textarea>
        </div>
      </div>

      <!-- Content Allarmi -->
      <div class="flex gap-6" id="allarmi">

      </div>

      <!-- Content Utenti-->
      <div class="flex gap-6" id="utenti">

      </div>

    </div>
  </div>

  <script src="index.js"></script>
</body>

</html>
