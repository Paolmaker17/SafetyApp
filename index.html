<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/png" href="">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Safety App</title>
</head>
<body class="flex justify-center bg-[var(--bg)] text-[var(--text)] inter select-none">

  <!-- User -->
  <div id="menu" class="absolute right-3 top-3 cursor-pointer">
    <div id="user" class="flex items-center gap-3 bg-[var(--card)] border border-[var(--border)] px-4 py-2 rounded-2xl shadow-md transition hover:shadow-lg">

      <img src="docs/user-n.png" class="w-9 h-9 rounded-full border-2 border-[var(--border)] object-cover">

      <div class="flex flex-col">
        <span class="font-semibold text-sm">User Name</span>
        <span class="text-xs text-[var(--text-light)]">Online</span>
      </div>

      <svg class="w-4 h-4 text-[var(--text-light)] transition"
          fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>

    <div id="dropdown" class="absolute right-0 mt-2 w-44 bg-[var(--card)] border border-[var(--border)] rounded-xl shadow-xl opacity-0 translate-y-2 pointer-events-none transition-all duration-200">
      <button class="w-full text-left px-4 py-3 text-sm font-semibold border-b border-[var(--border)] text-[var(--text-light)] hover:bg-[var(--soft)] rounded-t-xl transition">
        Profilo
      </button>

      <button class="w-full text-left px-4 py-3 text-sm font-semibold text-[var(--allarm-off-text)] hover:bg-[var(--allarm-off)]/10 rounded-b-xl transition">
        Logout
      </button>
    </div>
  </div>
  
  <div class="relative top-24 w-[85%] max-w-5xl">
    
    <!-- Tabs -->
    <div class="flex border-b border-[var(--border)] text-[var(--text-light)]">
      <button disabled data-name="invioAllarme"
        class="disabled:translate-y-px px-6 py-2 bg-[var(--soft)] border border-[var(--border)] border-b-0 rounded-t-xl font-semibold hover:bg-[#FFE4D9] disabled:bg-[var(--card)] transition">
        Invio Allarme
      </button>

      <button data-name="allarmi"
        class="disabled:translate-y-px px-6 py-2 bg-[var(--soft)] border border-[var(--border)] border-b-0 rounded-t-xl font-semibold hover:bg-[#FFE4D9] disabled:bg-[var(--card)] transition">
        Allarmi
      </button>

      <button data-name="utenti"
        class="disabled:translate-y-px px-6 py-2 bg-[var(--soft)] border border-[var(--border)] border-b-0 rounded-t-xl font-semibold hover:bg-[#FFE4D9] disabled:bg-[var(--card)] transition">
        Utenti
      </button>
    </div>

    <div class="bg-[var(--card)] shadow-xl rounded-b-xl p-6 border border-t-0 border-[var(--border)]">

      <!-- Content Invio Allarme -->
      <div class="flex gap-6" id="invioAllarme">

        <div class="w-1/3 space-y-4">
          <div class="bg-[var(--soft)] border border-[var(--border)] rounded-xl p-3">
            <select
              class="text-[var(--text-light)] font-semibold w-full p-3 rounded-xl border border-[var(--border)] focus:border-[var(--allarm)] focus:ring-4 focus:ring-[var(--allarm)]/20 outline-none transition bg-[var(--card)]">
              <option value="1">Allarme Terremoto</option>
              <option value="2">Allarme Incendio</option>
              <option value="3">Allarme Alluvione</option>
              <option value="4" selected>Allarme Generico</option>
            </select>
          </div>

          <hr class="text-[var(--border)]">

          <div class="bg-[var(--soft)] border border-[var(--border)] rounded-xl p-3 h-24 flex items-center">
            <button
              class="w-full font-extrabold h-full bg-[var(--allarm)] hover:bg-[var(--allarm-hover)] text-white rounded-xl transition transform hover:-translate-y-1 hover:shadow-lg">Invia
              Allarme</button>
          </div>
        </div>

        <div class="w-2/3 bg-[var(--soft)] border border-[var(--border)] rounded-xl p-4 h-64 flex flex-col">
          <label class="mb-2 font-semibold text-[var(--text-light)]">Descrizione</label>
          <textarea spellcheck="false" class="w-full 
                          h-full 
                          p-3 
                          resize-none 
                          rounded-xl 
                          border 
                          border-[var(--border)] 
                          focus:border-[var(--allarm)] 
                          focus:ring-4 
                          focus:ring-[var(--allarm)]/20 
                          outline-none 
                          transition 
                          bg-[var(--card)]
                          select-text
                          selection:bg-[var(--border)]"></textarea>
        </div>
      </div>

      <!-- Content Allarmi -->
      <div class="flex gap-6" id="allarmi">

      </div>

      <!-- Content Utenti-->
      <div class="flex gap-6" id="utenti">

      </div>

    </div>

    <!-- Stato Allarme -->
    <div class="relative left-[25%] w-[50%] top-12 bg-[var(--card)] shadow-xl rounded-4xl p-4 border border-[var(--border)] font-bold">
      <div id="on" class="hidden bg-[var(--allarm-on)]/70 shadow-xl rounded-3xl p-3 text-center text-[var(--allarm-on-text)]">
        L'allarme è attualmente attivo, bella non è :(
      </div>

      <div id="off" class="bg-[var(--allarm-off)]/70 shadow-xl rounded-3xl p-3 text-center text-[var(--allarm-off-text)]">
        L'allarme è attualmente spento, siamo al sicuro :)
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
